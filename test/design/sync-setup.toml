# --- 自動adopt（applyAutoAdopt / adoptRemoteIntoEmptyRepo） ---

[[condition]]
id = "sync-adopt.pc-b-recovery-e2e"
target_function = "applyAutoAdopt / adoptRemoteIntoEmptyRepo"
source = "docs/design/sync-setup.md 自動adoptのテスト観点 16e"
source_lines = "test/sync.test.ts:653"
description = "PC-Bが先にaddしただけの空repoにremote接続すると、remoteのデータを自動的に取り込んで復旧が完結する。ブートストラップファイル（config.json/.gitignore）の未追跡時退避ロジックの回帰確認を兼ねる"
given = "bare remoteにconfig.jsonを含む形でPC-A相当のpush内容をcommit済み。ローカルはsyncCommand(['add', '--id', 'shared'])（remote無し・未追跡config.json/.gitignoreが存在・commit無し）に続けてsyncCommand(['set', '--remote', remotePath])"
expect_return_shape = "ログに'Adopted existing data from remote.'を含み、hasSyncProject('shared') === true。以後syncCommand(['pull'])がexitせず成功する"

[[condition]]
id = "sync-adopt.non-main-branch-resolution"
target_function = "adoptRemoteIntoEmptyRepo"
source = "docs/design/sync-setup.md 自動adoptのテスト観点 16e2"
source_lines = "test/sync.test.ts:668"
description = "remoteのデフォルトブランチがmain/master以外でも、HEADのsymref解決により正しいブランチがadoptされる（git branch -rの表示順への依存を排除）"
given = "bare remoteのデフォルトブランチがtrunk（main/master以外）で、他に古い保守用ブランチlegacyも存在する状態で16eと同じ手順を実行"
expect_return_shape = "origin/legacyではなくorigin/trunk（remoteのHEAD symrefが指す方）がadoptされる。git -C SYNC_DIR branch --show-current === 'trunk'"

